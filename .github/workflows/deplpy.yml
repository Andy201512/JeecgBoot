name: release jeecg-boot-vue
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: change diretory
        run: |
          cd ./jeecgboot-vue3
          ls -al
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install dependencies
        run: pnpm i
      - name: Build
        run: npm run build
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          fail_on_unmatched_files: true
