name: release jeecg-boot-vue
on:
  push:
    tags:
      - 'v0.*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'npm'
      - name: change diretory
        run: cd ./jeecgboot-vue3 
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          draft: true
          fail_on_unmatched_files: true
